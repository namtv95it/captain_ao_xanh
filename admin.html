<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Captain Áo Xanh</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700;900&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>

<body>

  <!-- Particle Canvas -->
  <canvas id="particles-canvas"></canvas>
  <div class="noise"></div>

  <!-- ===== PIN SCREEN ===== -->
  <div id="pin-screen" class="pin-screen">
    <div class="pin-card">

      <div class="pin-header">
        <img src="captain.png" alt="Captain Áo Xanh" class="pin-avatar" />
        <h1 class="pin-title">Admin Panel</h1>
        <p class="pin-subtitle">Nhập mật khẩu để đăng nhập</p>
      </div>

      <!-- Ô nhập mật khẩu -->
      <form id="pin-form" class="pin-form" novalidate>
        <div class="pin-input-wrap" id="pin-dots">
          <svg class="pin-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            type="password"
            id="pin-input"
            class="pin-input"
            placeholder="Nhập mật khẩu..."
            autocomplete="current-password"
            maxlength="32"
            autofocus
          />
          <button type="button" id="pin-toggle-btn" class="pin-toggle-btn" aria-label="Hiện/ẩn mật khẩu">
            <svg id="pin-eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <button type="submit" class="pin-submit-btn" id="pin-submit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Đăng nhập
        </button>
      </form>

      <div id="pin-message" class="pin-message"></div>

    </div>
  </div>

  <!-- ===== ADMIN DASHBOARD ===== -->
  <div id="admin-dashboard" class="admin-dashboard hidden">

    <header class="admin-header">
      <div class="admin-header-actions">
        <!-- Avatar Dropdown Menu -->
        <div class="avatar-dropdown" id="avatar-dropdown">
          <button class="avatar-trigger-btn" id="avatar-trigger-btn" aria-expanded="false" aria-label="Menu tài khoản">
            <img src="captain.png" alt="Admin" class="header-avatar-img" />
            <svg class="dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <div class="avatar-dropdown-menu hidden" id="avatar-dropdown-menu">
            <div class="dropdown-header">
              <img src="captain.png" alt="Captain Áo Xanh" class="dropdown-user-avatar" />
              <div class="dropdown-user-info">
                <span class="user-name">Captain Áo Xanh</span>
                <span class="user-role">Quản trị viên</span>
              </div>
            </div>
            <div class="dropdown-divider"></div>
            <a href="index.html" class="dropdown-item" id="btn-view-site">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6" />
                <polyline points="15 3 21 3 21 9" />
                <line x1="10" y1="14" x2="21" y2="3" />
              </svg>
              <span>Xem trang chủ</span>
            </a>
            <button class="dropdown-item logout-item" id="btn-logout">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              <span>Đăng xuất</span>
            </button>
          </div>
        </div>

        <!-- Group các nút điều khiển sắp xếp -->
        <div class="sort-header-group">
          <button class="admin-btn-secondary cancel-sort-btn hidden" id="btn-cancel-sort">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            <span>Hủy</span>
          </button>
          
          <button class="admin-btn-secondary sort-header-btn" id="btn-toggle-sort">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M7 15l5 5 5-5"/>
              <path d="M7 9l5-5 5 5"/>
            </svg>
            <span id="sort-btn-text">Sắp xếp</span>
          </button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-section">
        <div class="admin-section-header">
          <h2 class="admin-section-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z" />
            </svg>
            Video YouTube Nổi Bật
          </h2>
          <button class="admin-btn-primary" id="btn-add-video">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Thêm video
          </button>
        </div>

        <div id="video-admin-list" class="video-admin-list">
          <div class="admin-loading">
            <div class="spinner"></div>
            <p>Đang tải danh sách video...</p>
          </div>
        </div>
      </div>
    </main>

  </div>

  <!-- ===== MODAL: Thêm / Sửa Video ===== -->
  <div id="video-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Thêm video mới</h3>
        <button class="modal-close" id="modal-close" aria-label="Đóng">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <form id="video-form" class="modal-form" novalidate>
        <input type="hidden" id="video-doc-id" />

        <div class="form-group">
          <label for="video-title-input">Tiêu đề video</label>
          <input type="text" id="video-title-input" placeholder="VD: Quy Khư - Phần 1" required />
        </div>

        <div class="form-group">
          <label for="video-url-input">Link video (YouTube)</label>
          <input type="url" id="video-url-input" placeholder="https://youtu.be/..." required />
        </div>

        <div class="form-group">
          <label>Thumbnail ảnh đại diện</label>
          <!-- Upload area: drag & drop hoặc click -->
          <div class="upload-area" id="upload-area">
            <input type="file" id="video-thumb-file" accept="image/*" hidden />

            <!-- Trạng thái chưa chọn ảnh -->
            <div id="upload-placeholder" class="upload-placeholder">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
              <p>Kéo thả ảnh hoặc <span class="upload-browse">chọn file</span></p>
              <span class="upload-hint">PNG · JPG · WebP — tự động nén về ≤ 480px</span>
            </div>

            <!-- Trạng thái đã chọn ảnh -->
            <div id="upload-preview-wrap" class="upload-preview-wrap hidden">
              <img id="upload-preview-img" src="" alt="preview" />
              <div class="upload-preview-overlay">
                <div id="upload-size-info" class="upload-size-info"></div>
                <button type="button" class="upload-remove-btn" id="upload-remove-btn">
                  ✕ Đổi ảnh
                </button>
              </div>
            </div>
          </div>
          <!-- Base64 được lưu vào hidden input -->
          <input type="hidden" id="video-thumb-base64" />
        </div>

        <div class="form-group">
          <label for="video-channel-input">Tên kênh</label>
          <input type="text" id="video-channel-input" placeholder="VD: Phê Sữa Review" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="video-order-input">Thứ tự hiển thị</label>
            <input type="number" id="video-order-input" placeholder="1" min="1" max="99" />
          </div>
          <div class="form-group form-group-toggle">
            <label for="video-visible-input">Hiển thị</label>
            <label class="toggle-switch">
              <input type="checkbox" id="video-visible-input" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="admin-btn-secondary" id="btn-cancel-modal">Hủy</button>
          <button type="submit" class="admin-btn-primary" id="btn-save-video">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="20 6 9 17 4 12" />
            </svg>
            Lưu video
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden" role="alert"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <!-- Shared particle effects -->
  <script src="main.js"></script>

  <!-- Admin logic -->
  <script src="admin.js"></script>

</body>

</html>
